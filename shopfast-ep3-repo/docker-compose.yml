services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shopfast-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopfast-api
    environment:
      - SHOPFAST_API_KEY=${SHOPFAST_API_KEY:-shopfast-ep3-key-2026}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-2000}
      - QUEUE_BACKEND=${QUEUE_BACKEND:-rabbitmq}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SAGEMAKER_ENDPOINT_NAME=${SAGEMAKER_ENDPOINT_NAME:-}
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopfast-worker
    command: ["python", "-m", "worker.event_worker", "--interval", "5"]
    environment:
      - QUEUE_BACKEND=${QUEUE_BACKEND:-rabbitmq}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: shopfast-dashboard
    environment:
      - API_BASE_URL=http://api:8000
      - SHOPFAST_API_KEY=${SHOPFAST_API_KEY:-shopfast-ep3-key-2026}
    ports:
      - "8501:8501"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: shopfast-nginx-tls
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - dashboard
